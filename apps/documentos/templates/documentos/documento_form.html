{% extends 'base.html' %}
{% load bootstrap %}


{% block main %}

{{form.errors }}
    
    <!-- O form será adicionado pelo próprio Django de maneira automática -->
    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form | bootstrap}}
        <button type="submit">Adicionar</button>
    </form>
    
{% endblock main %}
